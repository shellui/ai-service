services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: shellui/ai-service:local
    container_name: ai-service
    ports:
      - "${AI_SERVICE_PORT:-8003}:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required. Copy .env.example to .env and set SECRET_KEY}"
      DEBUG: "${DEBUG:-true}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      POSTGRES_DATABASE_URL: "${POSTGRES_DATABASE_URL:-}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      SQLITE_PATH: "/app/data/db.sqlite3"
      IDENTITY_SERVICE_URL: "${IDENTITY_SERVICE_URL:-http://host.docker.internal:8000}"
      IDENTITY_JWKS: "${IDENTITY_JWKS:-}"
      IDENTITY_JWKS_FILE: "${IDENTITY_JWKS_FILE:-}"
      IDENTITY_JWKS_URL: "${IDENTITY_JWKS_URL:-}"
      IDENTITY_ISSUER: "${IDENTITY_ISSUER:-}"
      IDENTITY_AUDIENCE: "${IDENTITY_AUDIENCE:-}"
      AI_SERVICE_SIGNING_KEY: "${AI_SERVICE_SIGNING_KEY:-}"
      AI_SERVICE_SIGNING_KEY_FILE: "${AI_SERVICE_SIGNING_KEY_FILE:-}"
      AI_SERVICE_SIGNING_KID: "${AI_SERVICE_SIGNING_KID:-}"
      AI_SERVICE_ISSUER: "${AI_SERVICE_ISSUER:-}"
      STORAGE_SERVICE_URL: "${STORAGE_SERVICE_URL:-http://host.docker.internal:8001}"
      HOSTING_SERVICE_URL: "${HOSTING_SERVICE_URL:-http://host.docker.internal:8002}"
      EMAIL_SERVICE_URL: "${EMAIL_SERVICE_URL:-https://email.shellui.com}"
      EMAIL_SERVICE_API_KEY: "${EMAIL_SERVICE_API_KEY:-}"
      SAAS_SERVICE_URL: "${SAAS_SERVICE_URL:-}"
      MCP_GATEWAY_TOOLS_CACHE_TTL_SECONDS: "${MCP_GATEWAY_TOOLS_CACHE_TTL_SECONDS:-30}"
      MCP_GATEWAY_DOWNSTREAM_TIMEOUT_SECONDS: "${MCP_GATEWAY_DOWNSTREAM_TIMEOUT_SECONDS:-5}"
      CORS_ALLOW_ALL_ORIGINS: "${CORS_ALLOW_ALL_ORIGINS:-true}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-}"
      SENTRY_RELEASE: "${SENTRY_RELEASE:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
    depends_on:
      - redis
    volumes:
      - ai-service-data:/app/data
    restart: unless-stopped

volumes:
  ai-service-data:
