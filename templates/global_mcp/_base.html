<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    {% load static %}
    {% include "includes/shellui_favicons.html" %}
    <link rel="stylesheet" href="{% static 'css/site.css' %}" />
    <title>{% block title %}Shellui AI{% endblock %} · Shellui AI</title>
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("theme"); } catch (e) {}
        var theme =
          stored ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body class="flex min-h-full flex-col bg-muted text-foreground antialiased dark:bg-background">
    {% include "includes/shellui_logo_sprite.html" %}
    <header class="border-b border-border/50 bg-background page-x">
      <nav class="mx-auto flex h-16 max-w-5xl items-center" aria-label="Global">
        <a
          href="/"
          class="inline-flex shrink-0 items-center text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
          aria-label="Shellui AI"
          translate="no"
        >
          <svg class="size-8.5" viewBox="0 0 1080 1080" role="img" aria-hidden="true">
            <use href="#logo-shellui-mark"></use>
          </svg>
        </a>
      </nav>
    </header>
    <main class="flex flex-1 items-center page-x py-12 sm:py-16">
      <div class="mx-auto w-full max-w-[480px] rounded-xl border border-border bg-card p-6 shadow-sm" {% block card_attrs %}{% endblock %}>
        {% block content %}{% endblock %}
      </div>
    </main>
  </body>
</html>
