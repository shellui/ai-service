<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approve an action · Shellui</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/site.css' %}" />
  </head>
  <body class="min-h-full bg-background text-foreground">
    <main class="mx-auto max-w-lg px-6 py-16">
      <h1 class="text-2xl font-semibold">Approve this action</h1>
      <p class="mt-3 text-sm">{{ summary }}</p>
      {% if destructive %}
        <p class="mt-3 text-sm">This action is destructive. Approving it here is the only way it runs.</p>
      {% endif %}
      <form method="post" class="mt-8 flex gap-3">
        {% csrf_token %}
        <button class="rounded bg-primary px-4 py-2 text-primary-foreground" type="submit" name="decision" value="allow">Approve</button>
        <button class="rounded border px-4 py-2" type="submit" name="decision" value="deny">Deny</button>
      </form>
    </main>
  </body>
</html>
