{% extends "global_mcp/_base.html" %}
{% block title %}Approve an action{% endblock %}
{% block content %}
        <h1 class="text-xl font-semibold tracking-tight text-balance text-foreground">Approve this action</h1>
        <p class="mt-3 text-sm leading-relaxed text-muted-foreground">{{ summary }}</p>
        {% if destructive %}
          <p class="mt-4 rounded-lg border border-amber-500/50 bg-amber-500/10 p-3.5 text-sm leading-relaxed text-foreground" role="alert">
            This action is destructive. Approving it here is the only way it runs.
          </p>
        {% endif %}
        <form method="post" class="mt-6 space-y-2.5">
          {% csrf_token %}
          <button
            class="min-h-11 w-full cursor-pointer rounded-md bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground transition-opacity hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
            type="submit"
            name="decision"
            value="allow"
          >Approve</button>
          <button
            class="min-h-11 w-full cursor-pointer rounded-md border border-border bg-transparent px-4 py-2.5 text-sm font-semibold text-foreground transition-colors hover:bg-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
            type="submit"
            name="decision"
            value="deny"
          >Deny</button>
        </form>
{% endblock %}
