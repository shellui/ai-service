[project]
name = "ai-service"
version = "0.4.2"
description = "Shellui AI service: aggregated MCP connector and future model API keys"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "django==6.0.8",
    "djangorestframework==3.18.2",
    "drf-spectacular==0.29.0",
    "drf-spectacular-sidecar==2026.10.1",
    "django-cors-headers==4.9.0",
    "python-dotenv==1.2.4",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.9",
    "gunicorn==27.0.1",
    "whitenoise==6.12.0",
    "sentry-sdk==2.77.0",
    "cryptography==50.0.2",
    "pyjwt==2.15.1",
    "requests==2.34.2",
    "markdown==3.11.4",
    "redis==8.2.0",
    "sqlparse==0.6.1",
    "djangorestframework-simplejwt==5.5.1",
    "shellui-django[mcp,otel]==0.7.2",
]

[dependency-groups]
dev = []
test = [
    "mcp>=1.11",
    "pytest>=8.3",
    "pytest-django>=4.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]

[tool.uv]
package = false
