[project]
name = "ai-service"
version = "0.3.0"
description = "Shellui AI service: aggregated MCP connector and future model API keys"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.0.8",
    "djangorestframework==3.18.2",
    "drf-spectacular==0.29.0",
    "drf-spectacular-sidecar==2026.10.1",
    "django-cors-headers==4.9.0",
    "python-dotenv==1.2.2",
    "dj-database-url==3.1.2",
    "psycopg[binary]==3.3.4",
    "gunicorn==26.0.0",
    "whitenoise==6.12.0",
    "sentry-sdk==2.63.0",
    "cryptography==50.0.0",
    "pyjwt==2.15.1",
    "requests==2.33.0",
    "markdown==3.10.2",
    "redis==8.1.0",
    "sqlparse==0.6.0",
    "djangorestframework-simplejwt==5.5.1",
    "shellui-django[mcp,otel]==0.7.0",
]

[dependency-groups]
dev = []
test = [
    "mcp>=1.11",
    "pytest>=8.3",
    "pytest-django>=4.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]

[tool.uv]
package = false
